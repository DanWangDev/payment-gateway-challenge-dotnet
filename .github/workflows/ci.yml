name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: ./coverage/**/coverage.cobertura.xml
          targetdir: ./coverage/report
          reporttypes: MarkdownSummaryGithub;Html

      - name: Add coverage to job summary
        run: cat ./coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage/report

  container-smoke-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Newman
        run: npm install --global newman@6.2.1

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Wait for gateway and bank simulator
        timeout-minutes: 2
        shell: bash
        run: |
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            # These read-only requests exercise both HTTP listeners without creating a payment.
            gateway_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 \
              http://localhost:8081/api/Payments/00000000-0000-0000-0000-000000000000 || true)
            bank_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 \
              http://localhost:8080/payments || true)
            # Unknown payment -> 404; the simulator's unsupported GET -> 400.
            if [[ "$gateway_status" == "404" && "$bank_status" == "400" ]]; then
              echo "Gateway and bank simulator are ready."
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready: gateway=$gateway_status, bank=$bank_status"
          exit 1

      - name: Run Postman collection
        run: |
          mkdir -p "$RUNNER_TEMP/container-smoke"
          newman run postman/PaymentGateway.postman_collection.json \
            --env-var baseUrl=http://localhost:8081 \
            --timeout-request 15000 \
            --reporters cli,junit \
            --reporter-junit-export "$RUNNER_TEMP/container-smoke/newman.xml"

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/container-smoke"
          docker compose ps --all > "$RUNNER_TEMP/container-smoke/containers.txt" 2>&1
          docker compose logs --no-color > "$RUNNER_TEMP/container-smoke/compose.log" 2>&1

      - name: Upload smoke test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke-results
          path: ${{ runner.temp }}/container-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
